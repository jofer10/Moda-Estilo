<div class="flex items-center justify-center min-h-screen bg-cover bg-center bg-fixed" style="background-image: url('https://e1.pxfuel.com/desktop-wallpaper/361/378/desktop-wallpaper-apparel-clothing-store.jpg');">
    <div class="bg-gray-800 bg-opacity-80 p-8 rounded-lg shadow-lg max-w-md w-full">
      <div class="text-center mb-6">
        <img src="assets/img/logo_login_mmm.png" alt="Flowbite Logo" class="mx-auto h-24 w-24 rounded-full" />
        <h2 class="text-white text-3xl font-bold mt-4" style="font-family: 'Dancing Script', cursive;">🌸Moda & Estilo🌸</h2>
      </div>
      <form (ngSubmit)="f.form.valid && login(f)" #f="ngForm">
        <div class="mb-4">
          <label for="email" class="block text-gray-300 text-sm font-bold mb-2">Correo</label>
          <input type="email" id="email" name="email" ngModel
          class="w-full px-3 py-2 bg-gray-700 text-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
          placeholder="name@company.com">
        </div>
        <div class="mb-4">
          <label for="password" class="block text-gray-300 text-sm font-bold mb-2">Contraseña</label>
          <input type="password" id="password" name="password" ngModel
          class="w-full px-3 py-2 bg-gray-700 text-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
          placeholder="••••••••">
        </div>
        <div class="flex items-center justify-end mb-6">
            <a href="#" class="text-sm text-gray-300 hover:text-gray-400 hover:underline">¿Olvidaste tu contraseña?</a>
        </div>
        <button class="w-full bg-pink-500 hover:bg-pink-600 text-white font-bold py-2 px-4 rounded-lg focus:outline-none focus:ring-2 focus:ring-pink-400">
            Iniciar Sesión
        </button>
      </form>
    </div>
  </div>
